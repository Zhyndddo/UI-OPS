name: Data Fix Scripts

# Manual-only, on-demand runner for the one-time backfill scripts in
# scripts/ (backfill-did-suffix.js, backfill-ar-to-ops.js,
# backfill-linkshare-timing.js) — lets you run them from the Actions tab
# without needing Node.js installed on your own machine. Defaults to a
# dry run (no `confirm` input) so you can read the planned changes in the
# job log before actually writing anything — re-run with confirm checked
# once the dry run looks right.
#
# This workflow only ever touches your Supabase database directly; it
# never commits or pushes anything, so running it has no effect on git or
# on Vercel deploys.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which backfill script to run"
        required: true
        type: choice
        options:
          - backfill-did-suffix
          - backfill-ar-to-ops
          - backfill-linkshare-timing
      confirm:
        description: "Actually write changes (unchecked = dry run only)"
        required: false
        type: boolean
        default: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # see backup.yml — @supabase/supabase-js needs native WebSocket, only present from Node 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save

      - name: Run ${{ inputs.script }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.confirm }}" = "true" ]; then
            node scripts/${{ inputs.script }}.js --confirm
          else
            node scripts/${{ inputs.script }}.js
          fi
