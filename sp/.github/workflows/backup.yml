name: Data Backup

on:
  schedule:
    # Every 2 hours, on the hour (UTC) — 12 runs/day. Bumped up from once
    # daily on 2026-08-20 after a production data-loss incident where the
    # only available backup was ~24h stale; this narrows the worst-case
    # recovery gap to ~2h. See scripts/backup.js for the per-run filename
    # format this relies on (one file per run, not one per day).
    - cron: "0 */2 * * *"
  workflow_dispatch: {} # lets anyone run a backup on demand from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Two checkouts side by side: `app` has the backup scripts (versioned
      # with the rest of the codebase on main), `data-backups` is where the
      # JSON snapshots actually live. Keeping backups off main means this
      # workflow's commits never touch the branch Vercel deploys from.
      - name: Checkout app (main)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout data-backups branch
        uses: actions/checkout@v4
        with:
          ref: data-backups
          path: data-backups
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20 — @supabase/supabase-js always spins up a realtime
          # client on createClient(), which needs a native WebSocket
          # implementation. That's only built into Node starting at 22;
          # on 20 it throws ("Node.js 20 detected without native WebSocket
          # support") the moment the backup script calls createClient().
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install @supabase/supabase-js --no-save

      - name: Run backup
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.js ../data-backups/backups/daily

      - name: Also copy today's backup into weekly on Sundays
        run: |
          STAMP=$(date -u +%F)
          if [ "$(date -u +%u)" = "7" ]; then
            mkdir -p data-backups/backups/weekly
            # Daily folder now holds one file per 2h run (STAMP_HHh.json),
            # not one per day — grab whichever run just wrote (this step
            # runs right after "Run backup", so it's always the latest for
            # today) rather than assuming an exact STAMP.json filename.
            LATEST=$(ls -t "data-backups/backups/daily/${STAMP}"_*h.json 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" "data-backups/backups/weekly/${STAMP}.json"
              echo "Saved weekly snapshot for ${STAMP} (from $(basename "$LATEST"))."
            else
              echo "No daily file found for ${STAMP} yet — skipping weekly copy."
            fi
          fi

      - name: Prune old backups
        working-directory: data-backups
        run: node ../app/scripts/prune-backups.js

      - name: Commit and push
        working-directory: data-backups
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "Backup $(date -u +%Y-%m-%d_%Hh)"
          git push origin data-backups
